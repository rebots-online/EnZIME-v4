[package]
name = "entitlement"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[dependencies]
domain = { path = "../domain" }
ports = { path = "../ports" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
