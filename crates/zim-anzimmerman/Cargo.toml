[package]
name = "zim-anzimmerman"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[dependencies]
domain = { path = "../domain" }
ports = { path = "../ports" }
async-trait = "0.1"
async-stream = "0.3"
bytes = { version = "1", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
ego-tree = "0.6"
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
