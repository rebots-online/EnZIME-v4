[package]
name = "inference-wllama"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[dependencies]
domain = { path = "../domain" }
ports = { path = "../ports" }
async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros", "rt"] }
tokio-stream = "0.1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros", "rt-multi-thread"] }
tempfile = "3"
