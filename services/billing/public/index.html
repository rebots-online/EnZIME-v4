<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnZIME — Purchase complete</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7fb; --fg:#1b1d27; --muted:#5b6070; --card:#fff; --accent:#4b5cff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1117; --fg:#eceef6; --muted:#a2a7b8; --card:#181b24; --accent:#8a96ff; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
           font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
    main { max-width:32rem; background:var(--card); border-radius:16px; padding:2rem; box-shadow:0 8px 30px rgb(0 0 0 / .08); }
    h1 { margin:0 0 .5rem; font-size:1.5rem; }
    p { color:var(--muted); margin:.5rem 0; }
    strong { color:var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>Thank you — you're all set.</h1>
    <p>Return to <strong>EnZIME Reader</strong>. Your plan activates automatically within a few seconds; if it doesn't, open <strong>Settings → Plan</strong> and choose <strong>Refresh</strong>.</p>
    <p>Your license key is in Settings. Keep it to restore your purchase on another device.</p>
  </main>
</body>
</html>
