[package]
name = "reader"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[lib]
name = "enzime_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = [
  "dep:platform-adapter",
  "dep:inference-wllama",
  "dep:revenuecat-adapter",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
platform-adapter = { path = "../../../crates/platform-adapter", optional = true }
inference-wllama = { path = "../../../crates/inference-wllama", optional = true }
revenuecat-adapter = { path = "../../../crates/revenuecat-adapter", optional = true }
