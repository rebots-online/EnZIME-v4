[package]
name = "reader"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[lib]
name = "enzime_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["platform-adapter", "inference-wllama", "revenuecat-adapter"]
platform-adapter = ["dep:platform-adapter"]
inference-wllama = ["dep:inference-wllama"]
revenuecat-adapter = ["dep:revenuecat-adapter"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
platform-adapter = { path = "../../../crates/platform-adapter", optional = true }
inference-wllama = { path = "../../../crates/inference-wllama", optional = true }
revenuecat-adapter = { path = "../../../crates/revenuecat-adapter", optional = true }

# M1 IPC bridge dependencies (Milestone-1 "produce a reading").
ports = { path = "../../../crates/ports" }
anzimmerman = { path = "../../../VENDOR/AnZIMmermanLib-src/AnZimmermanLIB/AnZimmermanLib/rust" }
catalog-openzim = { path = "../../../crates/catalog-openzim" }
fs2 = "0.4"
zim-anzimmerman = { path = "../../../crates/zim-anzimmerman" }
zim-cluster-cache = { path = "../../../crates/zim-cluster-cache" }
dyndon = { path = "../../../crates/dyndon" }
transfer-file = { path = "../../../crates/transfer-file" }
transfer-http = { path = "../../../crates/transfer-http" }
domain = { path = "../../../crates/domain" }
storage-sqlite = { path = "../../../crates/storage-sqlite" }
annotations = { path = "../../../crates/annotations" }
application = { path = "../../../crates/application" }
object-store = { path = "../../../crates/object-store" }
base64 = "0.21"
sha2 = "0.10"
hex = "0.4"
ulid = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
libc = "0.2"

cssparser = "0.36"
percent-encoding = "2"

[dev-dependencies]
flate2 = "1"
tempfile = "3"
